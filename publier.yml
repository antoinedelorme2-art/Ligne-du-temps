name: Publier la chronologie

# Trois déclencheurs : le bouton manuel, un rendez-vous hebdomadaire, et
# toute modification de l'interface poussée sur main.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"          # lundi, 11 h UTC (7 h à Montréal l'été)
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - robots.txt
      - generer_donnees.py
      - .github/workflows/publier.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl

      - name: Générer donnees.json depuis le classeur
        env:
          CLASSEUR: ${{ secrets.CLASSEUR }}
        run: |
          if [ -z "$CLASSEUR" ]; then
            echo "::error::Le secret CLASSEUR est vide. Settings → Secrets and variables → Actions."
            exit 1
          fi
          python generer_donnees.py "$CLASSEUR" --sortie site/donnees.json

      - name: Assembler le site
        run: |
          cp index.html app.js robots.txt site/
          touch site/.nojekyll
          ls -lh site/

      - name: Refuser de publier un fichier de données suspect
        run: |
          taille=$(stat -c%s site/donnees.json)
          echo "donnees.json : $taille octets"
          if [ "$taille" -lt 500000 ]; then
            echo "::error::Fichier anormalement petit — publication interrompue."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
