<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronologies</title>
<style>
:root{
  --papier:#E7E9E4;
  --panneau:#F7F8F5;
  --encre:#1B2320;
  --encre-pale:#5C6862;
  --trait:#C6CCC3;
  --trait-fort:#9BA69E;
  --rouge:#8E2317;
  --sel:#2C4C6B;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"Iowan Old Style",Georgia,serif;
  --sans:"Segoe UI",Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--papier);color:var(--encre);font-family:var(--sans);font-size:13px;
  display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:250px 1fr;
  grid-template-areas:"tete tete" "flanc scene" "pied pied";
  overflow:hidden;
}

/* ---------------------------------------------------------------- en-tête */
header{
  grid-area:tete;display:flex;align-items:baseline;gap:22px;
  padding:9px 16px 8px;border-bottom:1px solid var(--trait-fort);background:var(--panneau);
}
h1{font-family:var(--serif);font-size:19px;font-weight:600;margin:0;letter-spacing:.01em}
h1 #soustitre{color:var(--encre-pale);font-size:13px;font-style:italic;margin-left:9px}
.pousse{margin-left:auto}
.saut{display:flex;align-items:center;gap:6px}
.saut label{color:var(--encre-pale)}
input[type=text],input[type=number],input[type=search]{
  font:inherit;padding:4px 7px;border:1px solid var(--trait-fort);border-radius:2px;
  background:#fff;color:var(--encre);
}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
button{
  font:inherit;padding:4px 10px;border:1px solid var(--trait-fort);border-radius:2px;
  background:#fff;color:var(--encre);cursor:pointer;
}
button:hover{background:#EDEFEA}
button.actif{background:var(--encre);color:var(--panneau);border-color:var(--encre)}
.saut button{white-space:nowrap}
.langue{display:inline-flex;border:1px solid var(--trait-fort);border-radius:2px;overflow:hidden}
.langue button{border:0;border-radius:0;padding:4px 9px;font-size:12px;letter-spacing:.03em}
.langue button+button{border-left:1px solid var(--trait-fort)}
.rubans{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.ruban{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.ruban i{width:10px;height:10px;border-radius:2px;display:inline-block}
.zoom button{width:28px;padding:4px 0;font-size:15px;line-height:1}

/* ----------------------------------------------------------------- flanc */
#flanc{
  grid-area:flanc;background:var(--panneau);border-right:1px solid var(--trait-fort);
  overflow-y:auto;padding:12px 12px 24px;
}
#flanc h2{
  font-family:var(--serif);font-size:14px;font-weight:600;margin:16px 0 7px;
  padding-bottom:4px;border-bottom:1px solid var(--trait);
}
#flanc h2:first-child{margin-top:0}
#recherche{width:100%}
#resultats{margin:8px 0 0;max-height:230px;overflow-y:auto}
#resultats div{
  padding:4px 6px;border-left:3px solid transparent;cursor:pointer;line-height:1.3;
}
#resultats div:hover{background:#E7EAE4;border-left-color:var(--sel)}
#resultats em{color:var(--encre-pale);font-style:normal;display:block;font-size:11px}
.vide{color:var(--encre-pale);font-style:italic;padding:6px 0}
.sections{list-style:none;margin:0;padding:0}
.sections li{display:flex;align-items:center;gap:7px;padding:2px 0;line-height:1.25}
.sections input{margin:0;flex:none}
.sections label{cursor:pointer;flex:1}
.pastille{width:9px;height:9px;border-radius:50%;flex:none}
.compte{color:var(--encre-pale);font-size:11px}
.boutonnier{display:flex;gap:6px;margin-bottom:8px}
.boutonnier button{flex:1;padding:3px 0;font-size:12px}
.bascule{display:flex;align-items:flex-start;gap:7px;padding:4px 0;line-height:1.3}
.bascule input{margin:2px 0 0}

/* ----------------------------------------------------------------- scène */
#scene{grid-area:scene;position:relative;overflow:hidden}
#toile{display:block;cursor:grab}
#chargement{
  position:absolute;top:44%;left:0;right:0;text-align:center;z-index:3;
  font-family:var(--serif);font-size:15px;color:var(--encre-pale);line-height:1.5;
}
#chargement code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.credit{margin-left:auto;font-size:11px;color:var(--encre-pale);text-align:right;line-height:1.35}
.credit a{color:var(--sel)}
#toile.glisse{cursor:grabbing}
#bulle{
  position:absolute;pointer-events:none;z-index:5;max-width:330px;
  background:var(--encre);color:#F2F3EF;padding:6px 9px;border-radius:2px;
  font-size:12px;line-height:1.35;opacity:0;transition:opacity .08s;
}
#bulle b{font-weight:600}
#bulle i{display:block;color:#AEB8B2;font-style:normal;font-size:11px;margin-top:2px}

/* ---------------------------------------------------------------- tiroir */
#tiroir{
  position:absolute;top:0;right:0;bottom:0;width:390px;z-index:8;
  background:var(--panneau);border-left:1px solid var(--trait-fort);
  transform:translateX(100%);transition:transform .18s ease-out;
  display:flex;flex-direction:column;box-shadow:-6px 0 18px rgba(27,35,32,.09);
}
#tiroir.ouvert{transform:none}
@media (prefers-reduced-motion:reduce){#tiroir{transition:none}}
#tiroir header{
  grid-area:auto;display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;
  border-bottom:1px solid var(--trait);
}
#tiroir .corps{overflow-y:auto;padding:14px 16px 28px}
#tiroir h3{font-family:var(--serif);font-size:18px;line-height:1.25;margin:0;font-weight:600}
#tiroir .fr{font-family:var(--serif);font-style:italic;color:var(--encre-pale);font-size:15px;margin-top:3px}
.fermer{border:0;background:none;font-size:19px;line-height:1;padding:0 2px;color:var(--encre-pale);cursor:pointer}
.fermer:hover{color:var(--rouge);background:none}
.champ{margin-bottom:11px}
.champ dt{color:var(--encre-pale);font-size:11px;margin-bottom:1px}
.champ dd{margin:0;line-height:1.4}
.notice{
  font-family:var(--serif);font-size:14.5px;line-height:1.55;white-space:pre-wrap;
  margin-top:14px;padding-top:12px;border-top:1px solid var(--trait);
}
#tiroir a{color:var(--sel);word-break:break-all}
.jeton{
  display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;
  background:#DDE2DA;color:var(--encre-pale);
}
.jeton.avert{background:#F0E2D6;color:#7A4A21}

/* ------------------------------------------------------------------ pied */
footer{
  grid-area:pied;display:flex;align-items:center;gap:14px;
  border-top:1px solid var(--trait-fort);background:var(--panneau);padding:0 14px;
}
#apercu{flex:1;display:block;height:48px;cursor:pointer}
.aide{color:var(--encre-pale);font-size:11px;line-height:1.35;max-width:290px;padding:5px 0}
</style>
</head>
<body>

<header>
  <h1><span id="titrePage">Chronologies</span><span id="soustitre"></span></h1>
  <div class="saut">
    <label for="allerA" id="tAllerA">Aller à l'année</label>
    <input type="text" id="allerA" size="9" placeholder="-586 ou 1789">
  </div>
  <div class="saut zoom">
    <button id="moins">−</button>
    <button id="plus">+</button>
    <button id="tout">Tout voir</button>
  </div>
  <div class="saut pousse">
    <span class="langue">
      <button id="langFr" class="actif">FR</button><button id="langEn">EN</button>
    </span>
  </div>
  <div class="saut" id="etendue"></div>
</header>

<aside id="flanc">
  <h2 id="tRech">Rechercher</h2>
  <input type="search" id="recherche" placeholder="Nom d'un objet…" autocomplete="off">
  <div id="resultats"></div>

  <h2 id="tAff">Affichage</h2>
  <label class="bascule"><input type="checkbox" id="optVerif"> <span id="tVerif">Afficher seulement les dates lues dans le texte source</span></label>
  <label class="bascule"><input type="checkbox" id="optVides"> <span id="tVides">Masquer les pistes vides à l'écran</span></label>

  <h2 id="tSec">Sections</h2>
  <div class="boutonnier">
    <button id="toutCocher">Tout cocher</button>
    <button id="toutDecocher">Tout décocher</button>
  </div>
  <ul class="sections" id="listeSections"></ul>
</aside>

<main id="scene">
  <div id="chargement">Chargement de la chronologie…</div>
  <canvas id="toile"></canvas>
  <div id="bulle"></div>
  <div id="tiroir" aria-hidden="true">
    <header>
      <div style="flex:1">
        <h3 id="tTitre"></h3>
        <div class="fr" id="tFr"></div>
      </div>
      <button class="fermer" id="tFermer" title="Fermer">×</button>
    </header>
    <div class="corps" id="tCorps"></div>
  </div>
</main>

<footer>
  <canvas id="apercu"></canvas>
  <p class="aide" id="tAide"></p>
  <p class="credit">Sources&nbsp;: <a href="https://www.palquest.org" target="_blank" rel="noopener">Interactive
    Encyclopedia of the Palestine Question (palquest.org)</a><br>et World History Timeline</p>
</footer>

<script>
/* Les données sont dans un fichier à part : le navigateur les met en cache,
   et une correction de l'interface ne force pas leur retéléchargement. */
(async () => {
  const etat = document.getElementById("chargement");
  try {
    const r = await fetch("donnees.json", { cache: "default" });
    if (!r.ok) throw new Error(r.status + " " + r.statusText);
    window.DONNEES = await r.json();
  } catch (e) {
    etat.innerHTML = "<strong>Données introuvables.</strong><br>" +
      "Le fichier <code>donnees.json</code> doit se trouver à côté de cette page. " +
      "<span style='color:#8E2317'>" + e.message + "</span>";
    return;
  }
  etat.remove();
  const s = document.createElement("script");
  s.src = "app.js";
  document.body.appendChild(s);
})();
</script>

</body>
</html>
